<ion-header>
  <ion-toolbar color="primary">
    <ion-title>UrbanInspect</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Resumen de incidencias</h2>
  @if (error()) { <ion-text color="danger"><p>{{ error() }}</p></ion-text> }

  <ion-grid>
    <ion-row>
      <ion-col size="6"><ion-card><ion-card-content class="ion-text-center">
        <h1>{{ total() }}</h1><p>Total</p>
      </ion-card-content></ion-card></ion-col>
      <ion-col size="6"><ion-card color="warning"><ion-card-content class="ion-text-center">
        <h1>{{ pendientes() }}</h1><p>Pendientes</p>
      </ion-card-content></ion-card></ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6"><ion-card color="primary"><ion-card-content class="ion-text-center">
        <h1>{{ enProceso() }}</h1><p>En proceso</p>
      </ion-card-content></ion-card></ion-col>
      <ion-col size="6"><ion-card color="success"><ion-card-content class="ion-text-center">
        <h1>{{ resueltas() }}</h1><p>Resueltas</p>
      </ion-card-content></ion-card></ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12"><ion-card color="medium"><ion-card-content class="ion-text-center">
        <h1>{{ seguimiento.codigos().length }}</h1><p>En mi seguimiento</p>
      </ion-card-content></ion-card></ion-col>
    </ion-row>
  </ion-grid>

  <ion-button expand="block" size="large" color="success" routerLink="/nueva">
    <ion-icon slot="start" name="add"></ion-icon>Registrar incidencia
  </ion-button>
  <ion-button expand="block" size="large" fill="outline" routerLink="/tabs/tab2">
    <ion-icon slot="start" name="list"></ion-icon>Ver incidencias
  </ion-button>
</ion-content>

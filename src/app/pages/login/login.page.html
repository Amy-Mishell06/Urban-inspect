<ion-content>
  <div class="contenedor">
    <div class="logo">
      <ion-icon name="location"></ion-icon>
    </div>
    <h1>UrbanInspect</h1>
    <p class="subtitulo">Inspección de infraestructura urbana · Quito</p>

    <div class="tarjeta">
      <ion-item class="campo" lines="none">
        <ion-icon slot="start" name="mail"></ion-icon>
        <ion-input type="email" label="Correo" labelPlacement="stacked" autocomplete="email"
          inputmode="email" placeholder="inspector@urbaninspect.com" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item class="campo" lines="none">
        <ion-icon slot="start" name="lock-closed"></ion-icon>
        <ion-input type="password" label="Contraseña" labelPlacement="stacked"
          autocomplete="current-password" [(ngModel)]="clave" (keyup.enter)="ingresar()">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      @if (error()) {
        <div class="error">
          <ion-icon name="alert-circle"></ion-icon>
          <span>{{ error() }}</span>
        </div>
      }

      <ion-button expand="block" size="large" (click)="ingresar()" [disabled]="cargando()">
        @if (cargando()) { <ion-spinner name="crescent"></ion-spinner> } @else { Ingresar }
      </ion-button>

      <ion-button expand="block" fill="clear" size="small" (click)="recuperar()">
        ¿Olvidó su contraseña?
      </ion-button>
    </div>

    <p class="pie">Acceso solo para inspectores registrados por el municipio.</p>
  </div>
</ion-content>
